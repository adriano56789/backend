name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # Install sshpass if not available
          which sshpass 2>/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # Deploy commands
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$USER@$HOST" "
            cd /app/backend && \
            git pull && \
            docker compose -f docker-compose.vps.yml build backend && \
            docker compose -f docker-compose.vps.yml up --no-deps -d backend && \
            docker image prune -f
          "