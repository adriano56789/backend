# Coturn config for LiveGO - WebRTC TURN server
# REST API auth (HMAC-based time-limited credentials)

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=2.25.192.154
external-ip=2.25.192.154

# REST API auth (Secret Temporário) - deve corresponder a TURN_SECRET no .env
use-auth-secret
static-auth-secret=dev_turn_secret_key_change_me
realm=livego.store

# Performance
max-bps=5000000
total-quota=2000
stale-nonce=600

# Segurança
fingerprint
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-media-timeout

# Logging
verbose
