# Coturn config for LiveGO - WebRTC TURN server
# Compatível com /api/rtc/ice-servers (credenciais: livego / livegosecretpassword)

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=2.25.192.154
external-ip=2.25.192.154

# Credenciais estáticas (compatíveis com ice-servers endpoint)
lt-cred-mech
user=livego:livegosecretpassword
realm=livego.store

# Performance
max-bps=5000000
total-quota=2000
stale-nonce=600

# Segurança
fingerprint
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-media-timeout

# Logging
verbose
