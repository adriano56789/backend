    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livego-net

  srs:
    image: ossrs/srs:5
    container_name: app-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"
      - "1990:1990"
      - "8088:8088"
    volumes:
      - ./srs-docker.conf:/usr/local/srs/conf/srs.conf:ro
    environment:
      - CANDIDATE=2.25.192.154
    networks:
      - livego-net


  coturn:
    image: coturn/coturn:4.5.2
    container_name: app-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - livego-net



  ffmpeg:
    image: node:20-alpine
    container_name: app-ffmpeg
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./ffmpeg-worker.js:/app/worker.js:ro
      - ./package.json:/app/package.json:ro
    working_dir: /app
    entrypoint: ["sh", "-c", "apk add --no-cache ffmpeg && node worker.js"]
    networks:
      - livego-net

volumes:
  mongodb_data:
  redis_data:

networks:
  livego-net:
    name: app_livego-net
    external: true

