# Configuração SRS para LiveGo
# WebRTC + HLS/FLV + TURN + Callbacks + CORS
# Otimizada para Docker

max_connections     500;
srs_log_tank        console;
srs_log_level       trace;
srs_log_level_v2    info;
daemon              off;
in_docker           on;
empty_ip_ok         on;
pithy_print_ms      10000;
grace_start_wait    2300;
grace_final_wait    3200;
disable_daemon_for_docker on;
auto_reload_for_docker on;

# RTMP
rtmp {
    listen 1935;
    chunk_size 60000;
}

# HTTP API (para WebRTC signaling e callbacks)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
    # HTTPS API (porta 1990) - SSL/TLS para signaling
    https {
        enabled     on;
        listen      1990;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# HTTP Server (para HLS/FLV) - + HTTPS na 8088
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# WebRTC
rtc_server {
    enabled         on;
    listen          8000;

    candidate       2.25.192.154;
    api_as_candidates   off;
    resolve_api_domain  off;
    keep_api_domain     off;
    use_auto_detect_network_ip off;
    ip_family           ipv4;

    protocol        udp;
    ecdsa           on;
    encrypt         on;
    reuseport       1;
    merge_nalus     off;
}

vhost __defaultVhost__ {
    # HLS - fragmentos de 10s, janela de 60s
    hls {
        enabled             on;
        hls_path            ./objs/nginx/html;
        hls_fragment        10;
        hls_window          60;
        hls_cleanup         on;
        hls_dispose         120;
        hls_wait_keyframe   on;
        hls_recover         on;
    }

    # HTTP FLV - path usado pelo proxy backend
    http_remux {
        enabled     on;
        mount       /live/[stream].flv;
        fast_cache  30;
    }

    # WebRTC - conversao bidirecional com RTMP
    rtc {
        enabled             on;
        rtmp_to_rtc         on;
        rtc_to_rtmp         on;
    }

    # WHIP e WHEP para ingest e egress via WebRTC
    whip {
        enabled             on;
    }
    whep {
        enabled             on;
    }

    # Callbacks para o backend LiveGo
    http_hooks {
        enabled         on;
        on_publish      http://backend:3000/api/srs/publish;
        on_unpublish    http://backend:3000/api/srs/unpublish;
        on_play         http://backend:3000/api/srs/play;
        on_stop         http://backend:3000/api/srs/stop;
        on_connect      http://backend:3000/api/srs/connect;
        on_close        http://backend:3000/api/srs/close;
        on_hls          http://backend:3000/api/srs/hls;
    }
}
