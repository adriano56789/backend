# Configuração SRS para LiveGo
# WebRTC (WHIP/WHEP) + Callbacks + Forward dinâmico
# Arquitetura "apenas SRS" (sem LiveKit/HLS)

listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;
in_docker           on;
empty_ip_ok         on;
pithy_print_ms      10000;
grace_start_wait    2300;
grace_final_wait    3200;
disable_daemon_for_docker on;
auto_reload_for_docker on;

# HTTP API (para WebRTC signaling e callbacks)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP Server (para FLV/VOD via SRS)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# WebRTC
rtc_server {
    enabled         on;
    listen          8000;

    candidate       2.25.192.154;
    api_as_candidates   off;
    resolve_api_domain  on;
    keep_api_domain     off;
    use_auto_detect_network_ip on;
    ip_family           ipv4;
}

vhost __defaultVhost__ {
    # HLS removido — arquitetura "apenas SRS" (WebRTC WHIP/WHEP).
    # HTTP FLV removido — sem consumo de FLV no cliente.

    # WebRTC - conversao bidirecional com RTMP.
    # WHIP/WHEP são habilitados automaticamente pelo RTC.
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    # Dynamic Forward — SRS consulta o backend ao publicar uma live
    # e recebe destinos RTMP adicionais (via env SRS_FORWARD_DESTINATIONS).
    # Endpoint: POST /api/srs/forward (backend/src/routes/srsRoutes.ts)
    forward {
        enabled on;
        backend http://app-backend:3000/api/srs/forward;
    }

    # Callbacks para o backend LiveGo
    http_hooks {
        enabled         on;
        on_publish      http://app-backend:3000/api/srs/publish;
        on_unpublish    http://app-backend:3000/api/srs/unpublish;
        on_play         http://app-backend:3000/api/srs/play;
        on_stop         http://app-backend:3000/api/srs/stop;
    }
}
